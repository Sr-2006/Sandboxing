x-chaos-env: &chaos-env
  CHAOS_ENABLED: "${ENABLE_CHAOS:-false}"
  CHAOS_SECRET: "${CHAOS_SECRET:?CHAOS_SECRET must be set in .env}"
  SPRING_PROFILES_ACTIVE: "dev"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
  INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env}"

services:
  postgres-db:
    image: postgres:16.2-alpine
    container_name: postgres-db
    labels:
      - "ara.topology.group=backend"
      - "ara.topology.role=relational-database"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "on-failure:3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2.4-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    labels:
      - "ara.topology.group=backend"
      - "ara.topology.role=cache"
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    mem_limit: 256M
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13.0-management-alpine
    container_name: rabbitmq
    labels:
      - "ara.topology.group=backend"
      - "ara.topology.role=message-broker"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set in .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set in .env}
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  jaeger:
    image: jaegertracing/all-in-one:1.57.0
    container_name: jaeger
    labels:
      - "ara.topology.role=observability-query"
    ports:
      - "127.0.0.1:16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "on-failure:3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: otel-collector
    labels:
      - "ara.topology.role=observability-ingest"
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "127.0.0.1:1888:1888"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:13133:13133"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:55679:55679"
    mem_limit: 256M
    deploy:
      resources:
        limits:
          memory: 256M
    restart: "on-failure:3"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    labels:
      - "ara.topology.role=observability-metrics"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "on-failure:3"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    labels:
      - "ara.topology.role=observability-viz"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
    mem_limit: 256M
    deploy:
      resources:
        limits:
          memory: 256M
    restart: "on-failure:3"
    depends_on:
      - prometheus

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    cap_add:
      - NET_ADMIN
    labels:
      - "ara.topology.group=backend"
      - "ara.topology.role=edge-routing-and-rate-limiting"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *chaos-env
      AUTH_SERVICE_URL: "http://auth-service:8081"
      ORDER_SERVICE_URL: "http://order-service:8082"
      PAYMENT_SERVICE_URL: "http://payment-service:8083"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
      OTEL_SERVICE_NAME: "api-gateway"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5432/postgres"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?POSTGRES_USER must be set in .env}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - otel-collector

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    cap_add:
      - NET_ADMIN
    labels:
      - "ara.topology.group=backend"
      - "ara.topology.role=authentication-service"
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *chaos-env
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5432/auth_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?POSTGRES_USER must be set in .env}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
      OTEL_SERVICE_NAME: "auth-service"
    mem_limit: 384M
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres-db
      - redis
      - otel-collector

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    cap_add:
      - NET_ADMIN
    labels:
      - "ara.topology.group=backend"
      - "ara.topology.role=order-processing"
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: *chaos-env
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5432/order_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?POSTGRES_USER must be set in .env}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
      OTEL_SERVICE_NAME: "order-service"
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres-db
      - otel-collector

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    cap_add:
      - NET_ADMIN
    labels:
      - "ara.topology.group=backend"
      - "ara.topology.role=payment-processing"
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      <<: *chaos-env
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5432/payment_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?POSTGRES_USER must be set in .env}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
      OTEL_SERVICE_NAME: "payment-service"
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres-db
      - otel-collector

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    labels:
      - "ara.topology.role=observability-logging"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "on-failure:3"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: